name: SEO Build Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  seo-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application and SEO pages
        run: npm run build

      - name: Verify generated SEO routes
        run: |
          test -f dist/index.html
          test -f dist/features/index.html
          test -f dist/about/index.html
          test -f dist/pricing/index.html
          test -f dist/resources/index.html
          test -f dist/resources/budget-meal-planning/index.html
          test -f dist/resources/grocery-unit-price-calculator/index.html
          test -f dist/resources/compare-grocery-prices/index.html
          test -f dist/resources/meal-planning-app-with-grocery-list/index.html
          test -f dist/privacy/index.html
          test -f dist/terms/index.html
          test -f dist/login/index.html
          test -f dist/app/index.html
          test -f dist/404.html
          grep -q 'rel="canonical" href="https://the3cmall.com/"' dist/index.html
          grep -q 'rel="canonical" href="https://the3cmall.com/features"' dist/features/index.html
          grep -q 'rel="canonical" href="https://the3cmall.com/about"' dist/about/index.html
          grep -q '"@type":"AboutPage"' dist/about/index.html
          grep -q '"@type":"BreadcrumbList"' dist/about/index.html
          grep -q 'rel="canonical" href="https://the3cmall.com/pricing"' dist/pricing/index.html
          grep -q 'rel="canonical" href="https://the3cmall.com/resources"' dist/resources/index.html
          grep -q 'rel="canonical" href="https://the3cmall.com/resources/grocery-unit-price-calculator"' dist/resources/grocery-unit-price-calculator/index.html
          grep -q 'rel="canonical" href="https://the3cmall.com/resources/meal-planning-app-with-grocery-list"' dist/resources/meal-planning-app-with-grocery-list/index.html
          grep -q 'property="og:type" content="article"' dist/resources/grocery-unit-price-calculator/index.html
          grep -q 'property="og:type" content="article"' dist/resources/meal-planning-app-with-grocery-list/index.html
          grep -q '"@type":"Article"' dist/resources/grocery-unit-price-calculator/index.html
          grep -q '"@type":"Article"' dist/resources/meal-planning-app-with-grocery-list/index.html
          grep -q '"@type":"BreadcrumbList"' dist/resources/grocery-unit-price-calculator/index.html
          grep -q '"@type":"BreadcrumbList"' dist/resources/meal-planning-app-with-grocery-list/index.html
          grep -q "name=\"author\" content=\"Ell Vii's Automations\"" dist/index.html
          grep -q 'rel="author" href="https://ellviisautomations.com/"' dist/index.html
          grep -q 'https://ellviisautomations.com/#organization' dist/index.html
          grep -q 'noindex, nofollow, noarchive' dist/login/index.html
          grep -q 'noindex, nofollow, noarchive' dist/app/index.html
          grep -q 'id="seo-structured-data"' dist/index.html
          grep -q 'https://the3cmall.com/about' dist/sitemap.xml
          grep -q 'https://the3cmall.com/resources/budget-meal-planning' dist/sitemap.xml
          grep -q 'https://the3cmall.com/resources/meal-planning-app-with-grocery-list' dist/sitemap.xml
          grep -q '<lastmod>2026-09-16</lastmod>' dist/sitemap.xml
          test ! -f public/sitemap.xml
          test -f dist/8045f89b8caa97e934100fd14e33fd48.txt
          grep -qx '8045f89b8caa97e934100fd14e33fd48' dist/8045f89b8caa97e934100fd14e33fd48.txt
          grep -q 'Meal Planning App With a Grocery List: What to Compare Before Switching' dist/resources/meal-planning-app-with-grocery-list/index.html
          grep -q 'Compare meal-planning apps by grocery-list handoff' dist/resources/meal-planning-app-with-grocery-list/index.html
          grep -q 'Grocery budget and meal-planning guides' dist/resources/index.html
          if grep -q '"offers":' index.html; then
            echo "Source index.html must not expose planned beta pricing as active offers"
            exit 1
          fi
          if grep -q '"offers":' dist/pricing/index.html; then
            echo "Planned beta pricing must not be emitted as an active structured-data Offer"
            exit 1
          fi
          if grep -q 'rel="manifest"' dist/index.html; then
            echo "Public marketing home must not expose PWA install metadata"
            exit 1
          fi
          grep -q 'rel="manifest"' dist/app/index.html
          if grep -q '<changefreq>\|<priority>' dist/sitemap.xml; then
            echo "Sitemap contains unsupported changefreq or priority elements"
            exit 1
          fi
