name: Full Stack Routing Audit

on:
  push:
    branches:
      - agent/full-stack-routing-audit
  pull_request:

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build

  frontend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test -- --runInBand

  legacy-server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: server
        run: npm install --no-audit --no-fund
      - working-directory: server
        run: npm test -- --runInBand

  live-route-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check marketing and application routes
        shell: bash
        run: |
          set -euo pipefail

          check_status() {
            local expected="$1"
            local url="$2"
            local status
            status="$(curl --retry 2 --retry-delay 2 --silent --show-error --location --output /tmp/body --write-out '%{http_code}' "$url")"
            echo "$status $url"
            if [[ "$status" != "$expected" ]]; then
              cat /tmp/body
              exit 1
            fi
          }

          check_status 200 https://the3cmall.com/
          check_status 200 https://the3cmall.com/features
          check_status 200 https://the3cmall.com/pricing
          check_status 200 https://the3cmall.com/resources
          check_status 200 https://the3cmall.com/resources/budget-meal-planning
          check_status 200 https://the3cmall.com/resources/grocery-unit-price-calculator
          check_status 200 https://the3cmall.com/resources/compare-grocery-prices
          check_status 200 https://the3cmall.com/privacy
          check_status 200 https://the3cmall.com/terms
          check_status 200 https://the3cmall.app/login
          check_status 200 https://the3cmall.app/app

      - name: Check live D1 and API contracts
        shell: bash
        run: |
          set -euo pipefail

          status="$(curl --retry 2 --retry-delay 2 --silent --show-error --output /tmp/health.json --write-out '%{http_code}' https://the3cmall.app/api/health)"
          test "$status" = "200"
          jq -e '.ok == true and .database == "cloudflare-d1"' /tmp/health.json
          jq . /tmp/health.json

          status="$(curl --silent --show-error --output /tmp/session.json --write-out '%{http_code}' https://the3cmall.app/api/auth/session)"
          test "$status" = "200"
          jq -e '.user == null' /tmp/session.json

          status="$(curl --silent --show-error --output /tmp/waitlist.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data '{"email":"not-an-email"}' https://the3cmall.app/api/report/waitlist)"
          test "$status" = "400"
          jq -e '.code == "bad_request"' /tmp/waitlist.json

          status="$(curl --silent --show-error --output /tmp/stores.json --write-out '%{http_code}' 'https://the3cmall.app/api/stores/nearby')"
          test "$status" = "400"
          jq -e '.code == "invalid_latitude"' /tmp/stores.json

          status="$(curl --silent --show-error --output /tmp/admin.json --write-out '%{http_code}' https://the3cmall.app/api/admin/pilot-summary)"
          test "$status" = "401"
          jq -e '.code == "unauthorized"' /tmp/admin.json

          status="$(curl --silent --show-error --output /tmp/r2.json --write-out '%{http_code}' -X POST https://the3cmall.app/api/pilot/receipts)"
          test "$status" = "401"
          jq -e '.code == "unauthorized"' /tmp/r2.json
