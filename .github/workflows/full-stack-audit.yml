name: Full Stack Routing Audit

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm run build

  route-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm run audit:routes

  deployment-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify Cloudflare Pages architecture
        shell: bash
        run: |
          set -euo pipefail
          test -d functions
          test -f public/_redirects
          test -f public/_headers
          test -f wrangler.example.jsonc
          grep -q '"pages_build_output_dir": "dist"' wrangler.example.jsonc
          if [[ -f wrangler.toml || -f wrangler.json || -f wrangler.jsonc ]]; then
            echo "Unexpected active root Wrangler Worker config found. Review deployment ownership before merging."
            exit 1
          fi

  critical-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm run lint:critical

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm test -- --runInBand

  frontend-lint-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - name: Report non-critical frontend lint debt
        shell: bash
        run: |
          set +e
          npm run lint
          status=$?
          if [[ "$status" -ne 0 ]]; then
            echo "::warning::Broad frontend lint still has cleanup debt. Critical production code is gated separately by lint:critical; do not rewrite active customer screens solely to zero this report."
          fi
          exit 0

  legacy-server-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Report retired server tree
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d server ]]; then
            echo "::warning::The repository still contains the retired Express/Supabase server tree. It is excluded from the current Cloudflare Pages production path and should be removed only in a dedicated historical cleanup after references are verified."
          fi

  live-route-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check marketing and application routes
        shell: bash
        run: |
          set -euo pipefail

          check_status() {
            local expected="$1"
            local url="$2"
            local status
            status="$(curl --retry 2 --retry-delay 2 --silent --show-error --location --output /tmp/body --write-out '%{http_code}' "$url")"
            echo "$status $url"
            if [[ "$status" != "$expected" ]]; then
              cat /tmp/body
              exit 1
            fi
          }

          check_status 200 https://the3cmall.com/
          check_status 200 https://the3cmall.com/features
          check_status 200 https://the3cmall.com/about
          check_status 200 https://the3cmall.com/pricing
          check_status 200 https://the3cmall.com/resources
          check_status 200 https://the3cmall.com/resources/budget-meal-planning
          check_status 200 https://the3cmall.com/resources/grocery-unit-price-calculator
          check_status 200 https://the3cmall.com/resources/compare-grocery-prices
          check_status 200 https://the3cmall.com/privacy
          check_status 200 https://the3cmall.com/terms
          check_status 200 https://the3cmall.app/login
          check_status 200 https://the3cmall.app/app

      - name: Check live D1, email, and API contracts
        shell: bash
        run: |
          set -uo pipefail
          failures=0

          check_json() {
            local name="$1"
            local expected="$2"
            local jq_test="$3"
            shift 3
            local output="/tmp/${name}.json"
            local status
            status="$(curl --retry 2 --retry-delay 2 --silent --show-error --output "$output" --write-out '%{http_code}' "$@")"
            echo "$status $name"
            cat "$output"
            echo

            if [[ "$status" != "$expected" ]] || ! jq -e "$jq_test" "$output" >/dev/null; then
              echo "FAILED: $name"
              failures=$((failures + 1))
            fi
          }

          check_json health 200 '.ok == true and .database == "cloudflare-d1"' https://the3cmall.app/api/health
          check_json email-binding 200 '.emailConfigured == true' https://the3cmall.app/api/health
          check_json session 200 '.user == null' https://the3cmall.app/api/auth/session
          check_json waitlist 400 '.code == "bad_request"' -X POST -H 'content-type: application/json' --data '{"email":"not-an-email"}' https://the3cmall.app/api/report/waitlist
          check_json stores 400 '.code == "invalid_latitude"' https://the3cmall.app/api/stores/nearby
          check_json admin 401 '.code == "unauthorized"' https://the3cmall.app/api/admin/pilot-summary
          check_json receipts-auth 401 '.code == "unauthorized"' -X POST https://the3cmall.app/api/pilot/receipts
          check_json unknown-api 404 '.code == "not_found"' https://the3cmall.app/api/does-not-exist

          if [[ "$failures" -ne 0 ]]; then
            echo "$failures live API checks failed."
            exit 1
          fi

  production-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check production service bindings
        shell: bash
        run: |
          set -euo pipefail
          output=/tmp/health.json
          status="$(curl --retry 2 --retry-delay 2 --silent --show-error --output "$output" --write-out '%{http_code}' https://the3cmall.app/api/health)"
          cat "$output"
          if [[ "$status" != "200" ]]; then
            echo "Production health endpoint is unavailable."
            exit 1
          fi
          if ! jq -e '.receiptStorageConfigured == true' "$output" >/dev/null; then
            echo "::warning::R2 receipt storage is not configured in production. The application fails safely, but receipt uploads must remain unavailable/unmarketed until the RECEIPTS binding is connected."
          fi
